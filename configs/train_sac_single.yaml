train:
  algo: "SAC"
  total_timesteps: 150000
  save_path: "logs/checkpoints/sac_single_particle"
  model_version: "_v2"

  learning_rate: 0.0003
  buffer_size: 100000      # Flushes early random exploration before 150k steps
  learning_starts: 2000    # Start learning sooner with fewer random crash transitions
  batch_size: 256
  tau: 0.005
  gamma: 0.98              # Slightly shorter horizon -> sharper, decisive pathing
  train_freq: 1
  gradient_steps: 1
  ent_coef: "auto_0.1"     # Initial alpha=0.1 instead of 1.0 (prevents entropy domination)
  net_arch: [256, 256]

  eval_freq: 10000
  n_eval_episodes: 30
